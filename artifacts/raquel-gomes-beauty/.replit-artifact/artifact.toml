kind = "web"
previewPath = "/"
title = "Raquel Gomes Beauty & Makeup"
description = "Landing page premium para Raquel Gomes Beauty and Makeup / Raquel Gomes Micro, apresentando micropigmentação, maquiagem e estética facial em Borborema-SP, com galeria de trabalhos e agendamento pelo WhatsApp."
version = "1.0.0"
id = "artifacts/raquel-gomes-beauty"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20569

[services.development]
run = "pnpm --filter @workspace/raquel-gomes-beauty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/raquel-gomes-beauty", "run", "build" ]
serve = "static"
publicDir = "artifacts/raquel-gomes-beauty/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20569"
BASE_PATH = "/"
